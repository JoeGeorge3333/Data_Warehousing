version: 2

models:
  - name: oliver_dim_customer
    description: Customer dimension for Oliver sales warehouse
    columns:
      - name: cust_key
        tests:
          - not_null

  - name: oliver_dim_product
    description: Product dimension for Oliver sales warehouse
    columns:
      - name: product_key
        tests:
          - not_null

  - name: oliver_dim_employee
    description: Employee dimension for Oliver sales warehouse
    columns:
      - name: employee_key
        tests:
          - not_null

  - name: oliver_dim_store
    description: Store dimension for Oliver sales warehouse
    columns:
      - name: store_key
        tests:
          - not_null

  - name: oliver_dim_date
    description: Date dimension for Oliver sales warehouse
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

  - name: fact_sales
    description: Sales fact table at the order line grain

  - name: sales
    description: Semantic sales model built from the Oliver star schema