version: 2

models:
  - name: oliver_dim_customer
    description: Customer dimension for Oliver sales warehouse
    columns:
      - name: cust_key
        tests:
          - unique
          - not_null

  - name: oliver_dim_product
    description: Product dimension for Oliver sales warehouse
    columns:
      - name: product_key
        tests:
          - unique
          - not_null

  - name: oliver_dim_employee
    description: Employee dimension for Oliver sales warehouse
    columns:
      - name: employee_key
        tests:
          - unique
          - not_null

  - name: oliver_dim_store
    description: Store dimension for Oliver sales warehouse
    columns:
      - name: store_key
        tests:
          - unique
          - not_null

  - name: oliver_dim_date
    description: Date dimension for Oliver sales warehouse
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

  - name: fact_sales
    description: Sales fact table at the order line grain
    columns:
      - name: cust_key
        tests:
          - not_null
      - name: product_key
        tests:
          - not_null
      - name: employee_key
        tests:
          - not_null
      - name: store_key
        tests:
          - not_null
      - name: date_key
        tests:
          - not_null

  - name: sales
    description: Semantic sales model built from the Oliver star schema

  - name: stg_employee_certifications
    description: |
      Staging model for employee certification data sourced from Amazon S3 via Fivetran.
      Parses the raw certification_json field into discrete columns: certification_name,
      certification_cost, and certification_awarded_date.
      Each record represents one certification awarded to one employee.
    columns:
      - name: employee_key
        tests:
          - not_null

  - name: fact_certification
    description: |
      Employee Certification Fact.
      The grain of this table is employee + certification name + awarded date.
      Each record represents a single certification awarded to an employee on a given date.
    columns:
      - name: employee_key
        tests:
          - not_null


 


